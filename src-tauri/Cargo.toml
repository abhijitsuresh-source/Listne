[package]
name = "listne"
version = "1.0.0"
description = "Listne — Your private notekeeper"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "shell-open",
  "shell-execute",
  "shell-sidecar",
  "fs-read-file",
  "fs-write-file",
  "fs-exists",
  "dialog-open",
  "dialog-save",
  "http-all",
  "updater",
  "notification-all"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
